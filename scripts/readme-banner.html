<!doctype html>
<!-- The README banner. Rendered to docs/banner-{light,dark}.png by scripts/render-banner.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tapestry banner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F3; --ink: #0D0D0D; --muted: #7A7A7A; --accent: #EC4436; --accent2: #FF5FA2; --line: rgba(0,0,0,.06);
    --panel: #F1EFED; --card: #FFFFFF; --edge: rgba(0,0,0,.08);
  }
  .dark {
    --bg: #141414; --ink: #FFFFFF; --muted: #9A9A9A; --accent: #FF6A55; --accent2: #FF7FB5; --line: rgba(255,255,255,.08);
    --panel: #1B1B1B; --card: #242323; --edge: rgba(255,255,255,.09);
  }
  html, body { margin: 0; background: transparent; }
  body { width: 1280px; height: 640px; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .banner {
    position: relative; width: 1280px; height: 640px; border-radius: 32px; overflow: hidden; background: var(--bg);
    box-shadow: inset 0 0 0 1px var(--line); display: grid; grid-template-columns: 1fr 520px; align-items: center;
  }
  .text { padding-left: 88px; color: var(--ink); }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .brand img { width: 52px; height: 52px; }
  h1 { margin: 36px 0 0; font-size: 54px; line-height: 60px; font-weight: 700; letter-spacing: -0.03em; max-width: 640px; }
  p { margin: 20px 0 0; font-size: 22px; line-height: 30px; color: var(--muted); max-width: 540px; }
  .stage { position: relative; height: 640px; display: grid; place-items: center; }
  #halo { position: absolute; inset: 0; }

  /* The popover: a title and one tile per gesture, like the app's MappingTile. */
  .panel {
    position: relative; width: 330px; padding: 22px 16px 16px; border-radius: 24px; background: var(--panel);
    box-shadow: 0 0 0 1px var(--edge), 0 40px 100px rgba(236,68,54,.18); color: var(--ink);
  }
  .panel h2 { margin: 0 0 14px 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .tile {
    display: flex; align-items: center; gap: 12px; padding: 11px; border-radius: 14px; background: var(--card);
    box-shadow: 0 0 0 1px var(--edge);
  }
  .tile + .tile { margin-top: 8px; }
  .tile canvas { flex: none; width: 40px; height: 40px; }
  .tile b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .tile span { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .tile.fired { box-shadow: 0 0 0 2px var(--accent), 0 10px 30px rgba(236,68,54,.25); }
</style>
</head>
<body>
<div class="banner">
  <div class="text">
    <div class="brand"><img id="icon" alt="">Tapestry</div>
    <h1>Tap, hold, or swipe.<br>Run anything.</h1>
    <p>A macOS menu bar app that turns trackpad taps, holds, and diagonal swipes into keys, Shortcuts, and apps.</p>
  </div>
  <div class="stage">
    <canvas id="halo" width="1040" height="1280" style="width: 520px; height: 640px"></canvas>
    <div class="panel">
      <h2>Gestures</h2>
      <div class="tile"><canvas data-fingers="5" data-motion="tap"></canvas><div><b>Five-finger tap</b><span>Press ↩</span></div></div>
      <div class="tile"><canvas data-fingers="3" data-motion="hold"></canvas><div><b>Three-finger hold</b><span>Hold ⌥</span></div></div>
      <div class="tile fired"><canvas data-fingers="4" data-motion="upRight"></canvas><div><b>Four-finger swipe up-right</b><span>Run “Capture Area”</span></div></div>
      <div class="tile"><canvas data-fingers="4" data-motion="upLeft"></canvas><div><b>Four-finger swipe up-left</b><span>Open Terminal</span></div></div>
    </div>
  </div>
</div>
<script>
  const dark = location.search.includes('dark');
  if (dark) document.documentElement.classList.add('dark');
  document.getElementById('icon').src = `../docs/icon${dark ? '-dark' : ''}.png`;

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const accent = rgb(css('--accent')), accent2 = rgb(css('--accent2'));
  const rgba = (c, o) => `rgba(${c.join(',')},${o})`;

  // Pacer's dot ripple, frozen mid-wave, in Tapestry's coral and pink.
  {
    const ctx = document.getElementById('halo').getContext('2d');
    ctx.scale(2, 2);
    const w = 520, h = 640, cx = w / 2, cy = h / 2, max = 300, pitch = 18;
    for (let y = cy % pitch; y < h; y += pitch) {
      for (let x = cx % pitch; x < w; x += pitch) {
        const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy), fade = 1 - d / max;
        if (fade <= 0) continue;
        const wave = .5 + .5 * Math.sin(d / 30 - 1.2);
        ctx.fillStyle = rgba(mix(accent, accent2, (Math.atan2(dy, dx) / Math.PI + 1) / 2), (.12 + wave * .45) * fade);
        ctx.beginPath(); ctx.arc(x, y, .9 + wave * 2.6 * fade, 0, 7); ctx.fill();
      }
    }
  }

  // GestureGlyph from Theme.swift: one dot per finger in a slight arc, holds in a pressed capsule,
  // swipes trailing streaks.
  const directions = { upRight: [.7071, -.7071], upLeft: [-.7071, -.7071] };
  for (const canvas of document.querySelectorAll('.tile canvas')) {
    const size = 40, n = +canvas.dataset.fingers, motion = canvas.dataset.motion, dir = directions[motion];
    canvas.width = canvas.height = size * 2;
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    ctx.fillStyle = rgba(accent, .12);
    ctx.beginPath(); ctx.roundRect(0, 0, size, size, size * .3); ctx.fill();
    const dot = size * .135, pitch = size * .16;
    const c = [size / 2 + (dir ? dir[0] * size * .1 : 0), size / 2 + (dir ? dir[1] * size * .1 : 0)];
    const points = [...Array(n).keys()].map(i => {
      const t = n > 1 ? i / (n - 1) * 2 - 1 : 0;
      return [c[0] + (i - (n - 1) / 2) * pitch, c[1] + size * .05 * (t * t - .5)];
    });
    if (motion === 'hold') {
      const [first, last] = [points[0], points[n - 1]];
      ctx.fillStyle = rgba(accent, .22);
      ctx.beginPath(); ctx.roundRect(first[0] - dot, c[1] - dot * 1.05, last[0] - first[0] + dot * 2, dot * 2.1, dot * 1.05); ctx.fill();
    }
    for (const [x, y] of points) {
      if (dir) {
        const tail = [x - dir[0] * size * .26, y - dir[1] * size * .26];
        const g = ctx.createLinearGradient(x, y, tail[0], tail[1]);
        g.addColorStop(0, rgba(accent, .55)); g.addColorStop(1, rgba(accent, 0));
        ctx.strokeStyle = g; ctx.lineWidth = dot * .7; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(...tail); ctx.stroke();
      }
      ctx.fillStyle = rgba(accent, 1);
      ctx.beginPath(); ctx.arc(x, y, dot / 2, 0, 7); ctx.fill();
    }
  }
</script>
</body>
</html>

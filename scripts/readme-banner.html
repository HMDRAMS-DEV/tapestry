<!doctype html>
<!-- The README banner. Rendered to docs/banner-{light,dark}.png by scripts/render-banner.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tapestry banner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F3; --ink: #0D0D0D; --muted: #7A7A7A; --accent: #EC4436; --accent2: #FF5FA2; --line: rgba(0,0,0,.06);
    --pad: #FFFFFF; --pad-edge: rgba(0,0,0,.10); --key: #FFFFFF;
  }
  .dark {
    --bg: #141414; --ink: #FFFFFF; --muted: #9A9A9A; --accent: #FF6A55; --accent2: #FF7FB5; --line: rgba(255,255,255,.08);
    --pad: #1F1F22; --pad-edge: rgba(255,255,255,.12); --key: #26262A;
  }
  html, body { margin: 0; background: transparent; }
  body { width: 1280px; height: 640px; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .banner {
    position: relative; width: 1280px; height: 640px; border-radius: 32px; overflow: hidden; background: var(--bg);
    box-shadow: inset 0 0 0 1px var(--line); display: grid; grid-template-columns: 1fr 520px; align-items: center;
  }
  .text { padding-left: 88px; color: var(--ink); }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .brand img { width: 52px; height: 52px; }
  h1 { margin: 36px 0 0; font-size: 54px; line-height: 60px; font-weight: 700; letter-spacing: -0.03em; max-width: 640px; }
  p { margin: 20px 0 0; font-size: 22px; line-height: 30px; color: var(--muted); max-width: 540px; }
  .stage { position: relative; height: 640px; display: grid; place-items: center; }
  canvas { position: absolute; inset: 0; }

  .pad {
    position: relative; width: 340px; height: 240px; border-radius: 30px; background: var(--pad);
    box-shadow: 0 40px 100px rgba(236,68,54,.20), 0 0 0 1.5px var(--pad-edge);
    display: flex; align-items: center; justify-content: center; gap: 22px;
  }
  .tip { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%;
         background: linear-gradient(135deg, var(--accent), var(--accent2)); top: -18px; }
  .tip:nth-child(2), .tip:nth-child(4) { margin-top: -18px; }
  .tip:nth-child(3) { margin-top: -26px; }
  .tip::before, .tip::after { content: ""; position: absolute; border-radius: 50%; border: 3px solid var(--accent); }
  .tip::before { inset: -12px; opacity: .28; }
  .tip::after { inset: -22px; opacity: .10; }

  .key {
    position: absolute; right: 70px; bottom: 112px; width: 112px; height: 104px; border-radius: 20px; background: var(--key);
    box-shadow: 0 0 0 1.5px var(--pad-edge), 0 3px 0 var(--pad-edge), 0 20px 50px rgba(236,68,54,.28);
    color: var(--ink); padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;
    transform: translateY(3px);
  }
  .key .glyph { font-size: 30px; line-height: 1; align-self: flex-end; color: var(--accent); }
  .key .name { font-size: 17px; font-weight: 500; }
</style>
</head>
<body>
<div class="banner">
  <div class="text">
    <div class="brand"><img id="icon" alt="">Tapestry</div>
    <h1>Five fingers.<br>Press Return.</h1>
    <p>A macOS menu bar app that turns trackpad taps, holds, and diagonal swipes into keys, Shortcuts, and apps.</p>
  </div>
  <div class="stage">
    <canvas id="halo" width="1040" height="1280" style="width: 520px; height: 640px"></canvas>
    <div class="pad"><div class="tip"></div><div class="tip"></div><div class="tip"></div><div class="tip"></div><div class="tip"></div></div>
    <div class="key"><span class="glyph">↩</span><span class="name">return</span></div>
  </div>
</div>
<script>
  const dark = location.search.includes('dark');
  if (dark) document.documentElement.classList.add('dark');
  document.getElementById('icon').src = `../docs/icon${dark ? '-dark' : ''}.png`;

  // Pacer's dot ripple, frozen mid-wave, in Tapestry's coral and pink.
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const ctx = document.getElementById('halo').getContext('2d');
  ctx.scale(2, 2);
  const a = rgb(css('--accent')), v = rgb(css('--accent2'));
  const w = 520, h = 640, cx = w / 2, cy = h / 2, max = 300, pitch = 18;
  for (let y = cy % pitch; y < h; y += pitch) {
    for (let x = cx % pitch; x < w; x += pitch) {
      const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy), fade = 1 - d / max;
      if (fade <= 0) continue;
      const wave = .5 + .5 * Math.sin(d / 30 - 1.2);
      const c = mix(a, v, (Math.atan2(dy, dx) / Math.PI + 1) / 2);
      ctx.fillStyle = `rgba(${c.join(',')},${(.12 + wave * .45) * fade})`;
      ctx.beginPath(); ctx.arc(x, y, .9 + wave * 2.6 * fade, 0, 7); ctx.fill();
    }
  }
</script>
</body>
</html>
